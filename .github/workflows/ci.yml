# CI: כל push ל-main/app וכל Pull Request עוברים בדיקת טיפוסים, lint, בדיקות ובנייה מלאה.
# CD: Vercel מפרסם אוטומטית מ-main לפרודקשן (ומ-app לגרסת Preview) – ראו README.
name: CI

on:
  push:
    branches: [main, app]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # ערכים ציבוריים מדומים: הבנייה לא צריכה סודות, רק שהמשתנים יהיו מוגדרים
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder
